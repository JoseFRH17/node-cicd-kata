name: CI

on:
  pull_request:
    branches:
      - main
      - features/dice-plus-2
jobs:
  test:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 14.x

      - name: Install dependencies
        run: npm ci

      - name: Test lint
        run: npm run lint

      - name: Test format
        run: npm run format:check

      - name: Test types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test